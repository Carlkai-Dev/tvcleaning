plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.shishonomisaki.parentlock'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.shishonomisaki.parentlock'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
