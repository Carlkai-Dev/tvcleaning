name: Build and publish launcher to "latest" release

on:
  push:
    branches:
      - main

concurrency:
  group: build-and-release-launcher
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('launcher/**/gradle-wrapper.properties') }}-${{ hashFiles('launcher/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x launcher/gradlew

      - name: Install Android commandline tools and SDK packages
        run: |
          set -e
          ANDROID_SDK_ROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -sSLo cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q cmdline-tools.zip -d cmdline-tools
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Build (assembleRelease)
        working-directory: launcher
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Publish APKs to "latest" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Authenticate gh with the workflow token
          echo "$GITHUB_TOKEN" | gh auth login --with-token

          # enable globstar for ** expansion
          shopt -s globstar || true

          # collect apk/aab files (adjust glob if needed)
          FILES=(launcher/**/build/outputs/**/*.apk launcher/**/build/outputs/**/*.aab)
          # ensure at least one file exists
          FOUND=0
          for f in "${FILES[@]}"; do
            if [ -e "$f" ]; then
              FOUND=1
              break
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No APK/AAB files found under launcher/**/build/outputs. Aborting."
            exit 1
          fi

          # Build final list of existing files
          UPLOAD=()
          for f in "${FILES[@]}"; do
            if [ -e "$f" ]; then
              UPLOAD+=("$f")
            fi
          done

          # Create or update release 'latest' and upload assets (--clobber replaces assets)
          gh release create latest "${UPLOAD[@]}" --title "latest" --notes "Automated build from main: $GITHUB_SHA" --clobber
