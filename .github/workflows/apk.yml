name: APK

# Builds the launcher on GitHub so it can be installed from a computer with no JDK or Android SDK:
#   curl -L -o tvhome.apk https://github.com/<owner>/<repo>/releases/download/tv-latest/app-release.apk
#   APK_FILE=tvhome.apk TV_HOST=<tv ip> launcher/build-and-install.sh
# The release "tv-latest" is replaced by every build of the branches below.

on:
  push:
    branches: [launcher-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Lint
        working-directory: launcher
        continue-on-error: true
        run: ./gradlew --no-daemon lintRelease
      - name: APK size
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish the APK as the release tv-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest launcher/app/build/outputs/apk/release/app-release.apk \
            --title "TV launcher, latest build" \
            --notes "Built from commit ${GITHUB_SHA} of ${GITHUB_REF_NAME}. Install with APK_FILE=app-release.apk launcher/build-and-install.sh" \
            --prerelease --target "${GITHUB_SHA}"
