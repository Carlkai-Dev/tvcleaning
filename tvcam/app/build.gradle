plugins {
    id 'com.android.application'
}

android {
    namespace 'com.patilweb.tvcam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.patilweb.tvcam'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1-pip'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
