plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    sourceSets.main.assets.srcDirs += "$buildDir/generated/setup-assets"

    packagingOptions {
        resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module', 'META-INF/versions/**']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The TV Setup screen ships the same debloat list the shell scripts use, so there is one source of truth.
tasks.register('copyDebloatList', Copy) {
    from "$rootDir/../my-tv/debloat.txt"
    into "$buildDir/generated/setup-assets"
}
preBuild.dependsOn 'copyDebloatList'

dependencies {
    implementation('dev.mobile:dadb:1.2.9') {
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.junit.platform'
    }
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
